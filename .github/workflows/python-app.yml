name: Build ONN GN3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MEXC Mobile Scalper - ONN 100071481A
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Python 3.11
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # Android / Build dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip \
            zlib1g-dev


      # --------------------------------------------------
      # Rust
      # --------------------------------------------------
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version


      # --------------------------------------------------
      # Python build tools
      # --------------------------------------------------
      - name: Install Buildozer and Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.34


      # --------------------------------------------------
      # Show environment
      # --------------------------------------------------
      - name: Show build environment
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"
          python --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"
          buildozer --version

          echo "======================================"
          echo "CPU"
          echo "======================================"
          uname -m


      # --------------------------------------------------
      # Completely clean previous Android build
      # --------------------------------------------------
      - name: Clean Buildozer environment
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # --------------------------------------------------
      # Build ARM 32-bit APK
      # --------------------------------------------------
      - name: Build APK for ONN 100071481A
        env:
          P4A_NDK_VERSION: "28c"
        run: |
          buildozer -v android debug 2>&1 | tee build.log


      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

          echo "======================================"
          echo "BIN"
          echo "======================================"

          ls -lah bin || true


      # --------------------------------------------------
      # Inspect APK architecture
      # --------------------------------------------------
      - name: Check APK architecture
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          APK=$(find bin -type f -name "*.apk" | head -1)

          echo "APK:"
          echo "$APK"

          echo "======================================"
          echo "NATIVE LIBRARIES"
          echo "======================================"

          unzip -l "$APK" | grep "lib/" || true

          echo "======================================"
          echo "Expected architecture:"
          echo "armeabi-v7a"
          echo "======================================"


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload ONN APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Mobile-Scalper-ONN-GN3-ARM32
          path: bin/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # Upload build log
      # --------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Mobile-Scalper-Build-Log
          path: build.log
          if-no-files-found: warn


      # --------------------------------------------------
      # Show error if build fails
      # --------------------------------------------------
      - name: Show build error
        if: failure()
        run: |
          echo "======================================"
          echo "LAST 300 BUILD LOG LINES"
          echo "======================================"

          tail -n 300 build.log || true
